<form x-data="{ 
        changed: false, 
        editable: {{ item|yesno:'false,true' }},
        name: '{{ item.name|default:'' }}',
        baseUnit: '{{ item.base_unit_id|default:'' }}'
    }" 
      @input="changed = true"
      hx-post="{% url 'frontend:item_save' %}" 
      hx-target="#items-table" 
      hx-swap="innerHTML" 
      hx-on::after-request="if(event.detail.successful) { toast.success('Item saved successfully!'); window.dispatchEvent(new CustomEvent('close-modal')); }"
      class="space-y-5">
      
    {% csrf_token %}
    <input type="hidden" name="id" value="{{ item.id|default:'' }}">

    <!-- View Mode Unlock Button -->
    {% if item %}
    <div x-show="!editable" class="p-4 bg-amber-50 border border-amber-200 rounded-xl flex items-center justify-between">
        <p class="text-xs font-medium text-amber-700">You are viewing a read-only item.</p>
        <button type="button" @click="editable = true" class="px-3 py-1.5 text-xs font-semibold text-white bg-amber-500 rounded-lg hover:bg-amber-600">Edit Item</button>
    </div>
    {% endif %}

    <div>
        <label class="block text-xs font-semibold text-neutral-600 mb-1.5">Item Name *</label>
        <input type="text" name="name" x-model="name" required 
               :readonly="!editable"
               :class="!editable ? 'bg-neutral-50 text-neutral-500 cursor-not-allowed' : 'bg-white focus:outline-none focus:ring-2 focus:ring-green-500/20'"
               class="w-full px-4 py-2.5 text-sm border border-neutral-200 rounded-xl transition-all">
    </div>

    <div>
        <label class="block text-xs font-semibold text-neutral-600 mb-1.5">Barcode</label>
        <input type="text" name="barcode" value="{{ item.barcode|default:'' }}" 
               :readonly="!editable"
               :class="!editable ? 'bg-neutral-50 text-neutral-500 cursor-not-allowed' : 'bg-white focus:outline-none focus:ring-2 focus:ring-green-500/20'"
               class="w-full px-4 py-2.5 text-sm border border-neutral-200 rounded-xl transition-all">
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-semibold text-neutral-600 mb-1.5">Category</label>
            <select name="category" 
                    :disabled="!editable"
                    :class="!editable ? 'bg-neutral-50 text-neutral-500 cursor-not-allowed' : 'bg-white focus:outline-none focus:ring-2 focus:ring-green-500/20'"
                    class="w-full px-3 py-2.5 text-sm border border-neutral-200 rounded-xl transition-all appearance-none">
                <option value="">None</option>
                {% for c in categories %}
                <option value="{{ c.id }}" {% if item.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-neutral-600 mb-1.5">Base Unit *</label>
            <select name="base_unit" x-model="baseUnit" required 
                    :disabled="!editable"
                    :class="!editable ? 'bg-neutral-50 text-neutral-500 cursor-not-allowed' : 'bg-white focus:outline-none focus:ring-2 focus:ring-green-500/20'"
                    class="w-full px-3 py-2.5 text-sm border border-neutral-200 rounded-xl transition-all appearance-none">
                <option value="">Select</option>
                {% for u in units %}
                <option value="{{ u.id }}" {% if item.base_unit_id == u.id %}selected{% endif %}>{{ u.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div>
        <label class="block text-xs font-semibold text-neutral-600 mb-1.5">Cost Price (Moving Avg)</label>
        <input type="number" name="cost_price" step="0.01" value="{{ item.cost_price|default:'0' }}" 
               :readonly="!editable"
               :class="!editable ? 'bg-neutral-50 text-neutral-500 cursor-not-allowed' : 'bg-white focus:outline-none focus:ring-2 focus:ring-green-500/20'"
               class="w-full px-4 py-2.5 text-sm border border-neutral-200 rounded-xl transition-all">
        <p class="text-[0.65rem] text-neutral-400 mt-1">Note: This is automatically updated when you purchase stock.</p>
    </div>

    <div class="flex items-center justify-between p-4 bg-neutral-50 rounded-xl border border-neutral-100">
        <div class="text-sm font-semibold text-neutral-700">Active Item</div>
        <input type="checkbox" name="is_active" class="w-5 h-5 rounded text-green-500" :disabled="!editable" {% if not item or item.status == 'active' %}checked{% endif %}>
    </div>

    <div class="pt-4 border-t border-neutral-100">
        <button type="submit" 
                :disabled="!editable || !changed || !name || !baseUnit"
                :class="(!editable || !changed || !name || !baseUnit) ? 'bg-neutral-300 cursor-not-allowed' : 'bg-green-500 hover:bg-green-600'"
                class="w-full px-4 py-2.5 text-sm font-semibold text-white rounded-xl transition-all flex items-center justify-center gap-2">
            
            <span x-show="!editable" class="flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Switch to Edit Mode
            </span>
            
            <span x-show="editable && !changed" class="flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                No Changes Made
            </span>
            
            <span x-show="editable && changed && name && baseUnit" class="flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                Save Item
            </span>
        </button>
    </div>
</form>
